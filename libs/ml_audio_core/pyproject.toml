[project]
name = "ml-audio-core"
version = "0.1.0"
description = "Shared audio preprocessing and ML base classes"
readme = "README.md"
authors = [
    { name = "Johannes Geisler", email = "johannes.geisler@savonia.fi" }
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26.4",
    "panns-inference>=0.1.1",
    "sounddevice>=0.5.3",
    "soundfile>=0.13.1",
    "librosa>=0.10.0",
    "scikit-image>=0.20.0",
    "scipy>=1.10.0",
    "tqdm>=4.67.1",
    "tensorflow>=2.16.1",
    "torchaudio>=2.8.0",
    "tensorflow-hub>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_audio_core"]

[dependency-groups]
dev = []
