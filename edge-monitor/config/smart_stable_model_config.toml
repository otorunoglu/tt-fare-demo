# -----------------------------------------------------
# Label Group Severity Settings
# -----------------------------------------------------

# group_seconds_per_severity_level: covered seconds required for one severity level
[group_seconds_per_severity_level]
eating = 0.0
respiratory = 0.0
movement = 0.0
distress = 0.0
other = 0.0

# -----------------------------------------------------
# General model and rule parameters
# -----------------------------------------------------

[model_parameters]
# ── Shared: used by BOTH server (Python) and edge (Rust) ──
ignore_labels = [
  "unsure",
  "uncertain",
  "anomaly_normal",
  "anomaly_abnormal",
  "silence",
] # List of labels to filter out and default to background
silence_threshold = -60.0 # dBFS below which a segment is labeled silence
dominant_label_floor = 0.55 # min probability to consider a label as dominant
min_event_confidence = 0.5 # global minimum confidence to include an event
background_label = "background" # label considered as background noise
severity_step = 1.0 # step to increase severity for each subsequent event
group_cluster_warning_min_severity = 1.0 # global minimum severity for group warnings
merge_gap_seconds = 1.25 # max gap to still merge a cluster label (slightly > snippet)
burst_window_seconds = 120 # the window in which to look for bursts of events (s)
default_snippet_duration_seconds = 1.0 # duration of each audio snippet for coverage calculations
default_model_architecture = "panns"
night_hour_start = 20 # night window start hour (24h format)
night_hour_end = 7 # night window end hour (24h format)

# ── Server only: used by Python backend (smartstablemodel) ──
audio_backend = "rust"       # "rust" (default) or "librosa" (legacy, will differ from edge inference)
drop_below_floor = true      # whether to drop events below dominant_label_floor
update_interval_seconds = 10 # how often the decider reevaluates its state

# ── Edge only: used by Rust inference engine (stable-edge-monitor) ──
cluster_reset_seconds = 600 # reset cluster severity level after this many seconds of inactivity

# Confidence threshold for the classifier (0.0 - 1.0)
[model_parameters.classifier_thresholds] # This is for inference of the classifier
panns = 0.7
yamnet = 0.6 # Lower default for YAMNet

# -----------------------------------------------------
# Rolling restlessness index
# -----------------------------------------------------
# "Is the horse restless" was the single most requested alert in the owner survey (93.5%).
# The index is NOT produced by the inference loop — the webserver computes it on read from the
# events already in the DB (GET /api/data/restlessness). That means editing the weights below
# re-scores all existing history instead of invalidating it: tune, re-request, look at the plot.
# The config is re-read per request, so no service restart is needed while experimenting.
#
# Per bin the score is  sum over labels of  weight * min(covered_seconds, cap_seconds),
# normalized to points per minute, then smoothed with an EWMA, then compared against this
# horse's own trailing baseline for the same hour of day.
#
# ⚠️ Only weight labels the DEPLOYED CHECKPOINT emits. This file's trainable set is not that
# list: it describes what *should* be trained, and drifts from a checkpoint whenever a class is
# dropped for insufficient data. champion_v60 ships 13 classes and has neither `change_stance`
# nor `other_impact`, both of which this file marks trainable. The authority is the
# `*_label_mapping.json` beside the checkpoint, or GET /api/models/current.
# Weights below target champion_v60's classes. The endpoint reports `unseen_labels` for anything
# configured here that produced no events, which catches this mistake after the fact.
#
# Balance note: with equal exposure `horse_kick` supplied ~85% of the positive score, so the
# index was effectively a kick meter. It keeps the top ceiling (it is survey want #1 and the
# loudest welfare signal) but is now loudness-gated, and `neigh`/`nicker` — the sounds that
# actually track feeding anticipation in this barn — are weighted up to compete.

[restlessness]
enabled = true
bin_seconds = 60              # matches events_rollup granularity, so the index survives retention
half_life_minutes = 20.0      # how long a disturbance keeps counting (EWMA half-life)
baseline_window_days = 14     # trailing history used to learn this horse's normal; 0 disables
baseline_mode = "hour_of_day" # "hour_of_day" | "flat" | "none"
baseline_min_samples = 120    # bins needed in a bucket before it is trusted
baseline_min_scale = 1.0      # floor on the baseline spread (a quiet horse has MAD ~0)

# weight      = points per covered second
# cap_seconds = saturation per bin; 0 = no cap. Keeps one long episode from owning the index.
# The per-label CEILING (weight * cap_seconds) is what decides which behaviour can dominate —
# check it, not the weight, when changing these.
[restlessness.labels]
# ── restlessness evidence ──                         ceiling pts/min
horse_kick = { weight = 5.0, cap_seconds = 5.0 } # 25  survey #1 (73.9%); loudness-gated above
neigh = { weight = 2.5, cap_seconds = 10.0 }     # 25  survey #3 (58.7%); peaks at feeding time
rattle = { weight = 1.5, cap_seconds = 12.0 }    # 18  peaks right at the feed
nicker = { weight = 1.0, cap_seconds = 10.0 }    # 10  anticipatory feeding sound
walking = { weight = 0.5, cap_seconds = 30.0 }   # 15
snort = { weight = 0.5, cap_seconds = 10.0 }     #  5
# ── calm evidence (damps the score) ──
# Halved from -0.3 after measuring v60 on pi138: eating is 53% of all events there and sat at
# its cap in most bins, so it acted as a near-constant offset — which the hour-of-day baseline
# removes anyway — while pushing 641 of 1440 bins negative and making points/min unreadable.
# The cap stays at 30 s so eating still discriminates across its whole 0-30 s range.
eating = { weight = -0.15, cap_seconds = 30.0 }  # -4.5
drinking = { weight = -0.2, cap_seconds = 20.0 } # -4
# ── emitted by v60 but deliberately unweighted ──
sleeping_breathing = { weight = 0.0, cap_seconds = 30.0 } # calm, but recall 0.077 — do not trust
coughing = { weight = 0.0, cap_seconds = 10.0 }           # respiratory, not restlessness
# Removed: groan, panting, pawing, change_stance — not classes in champion_v60, so they could
# never fire. Re-add them if a later checkpoint brings them back.

[loudness_parameters]
enable_adaptive_loudness = true
loudness_warmup_seconds = 900    # baseline warmup (e.g. 15 min)
loudness_sigma_multiplier = 2.0  # trigger at mean > μ + kσ
loudness_min_window_seconds = 10 # required samples in window
loudness_min_std = 1.0           # floor for σ to avoid division by ~0
loudness_severity_scale = 1.0    # scale severity (z/k * scale)
