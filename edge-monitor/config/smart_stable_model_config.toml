# Horse Soundscape Monitoring - MetaModel Configuration
# -----------------------------------------------------
# This file defines alert labels, cluster detection thresholds, and label grouping weights.
# All numeric values are relative severities or confidence thresholds.

[[labels]]
name = "Horse Kick"
value = "horse_kick"
ls_group = "labels"
label_group = "distress"
show_in_ls = true
use_for_classifier_training = true
use_for_anomaly_training = true
training_importance = 1.0
description = "Single impact sound against walls, doors, or objects."
is_alert = false
is_cluster = true
cluster_seconds_per_severity_level = 8.0
cluster_warning_min_severity = 1.0
cluster_confidence_floor = 0.95
# Loudness gate, same machinery as `eating`. horse_kick fires in every hour of every day
# (never zero across 96 measured hour-samples, 16-338 s/h), so a large quiet tail is dropping
# into the restlessness index. A real kick is a loud impact, so keeping the top ~20% by loudness
# is a well-matched filter that needs no classifier change. Only the restlessness index and the
# inactivity alert consult these rules, and horse_kick is not in the inactivity label list.
auto_thresholding = true
threshold_mode = "auto"
threshold_percentile = 0.80
manual_threshold_db = -18.0
safety_margin_db = 3.0
min_samples_for_calibration = 200
calibration_mode = "rolling"
rolling_window = "14d"

[[labels]]
name = "Rattle Sound"
value = "rattle"
ls_group = "labels"
label_group = "other"
show_in_ls = true
use_for_classifier_training = true
use_for_anomaly_training = true
training_importance = 1.0
description = "Horses rattle against the cage or metal parts. Or other rattlesounds."
is_alert = false
is_cluster = true
cluster_seconds_per_severity_level = 20.0
cluster_warning_min_severity = 1.0
