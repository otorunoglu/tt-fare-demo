soundscape_detector:
    learning_rate: 1e-4
    batch_size: 32
    num_epochs: 50
    use_augmentation: true
    augmentation_factor: 3
    max_samples_per_class: null # Maximum number of samples per class
    dropout_rates: [0.4, 0.3, 0.2]
    min_samples_per_class: 30
    # Training metric for early stopping: "accuracy", "macro_f1", "balanced_accuracy"
    # Options: "accuracy", "macro_f1", "balanced_accuracy", "weighted_f1"
    # For imbalanced data, "macro_f1" treats all classes equally, 
    # while "weighted_f1" considers class importance weights. 
    # (requires label weights in labels.json e.g. "training_importance": 2.0)
    training_metric: "macro_f1"
    register_model: true
    auto_promote_to_production: false
