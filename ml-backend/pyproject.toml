[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartstable"
version = "0.0.1"
description = "Smart Stable ML backend"
requires-python = ">=3.10,<3.14"
dependencies = [
  "tf2onnx>=1.16.1",
  "numpy>=1.26.4",
  "tensorflow==2.20.0",
  "protobuf>=5.28.0",
  "onnx==1.16.1",
  "onnxruntime",
  "librosa",
  "matplotlib",
  "scikit-learn",
  "soundfile",
  "torch",
  "sounddevice",
  "panns-inference",
  "scikit-image",
  "pydantic",
  "apscheduler",
  "pandas",
  "seaborn",
  "mlflow",
  "fastapi",
  "uvicorn[standard]",
  "label-studio-sdk",
  "tensorflow-hub",
  "yt-dlp",
  "watchfiles",
]

[project.scripts]
metamodel-replay = "smartstablemodel.scripts.metamodel_replay:main"

[tool.uv]
# 1. THE LIE: Force everyone to use the new Protobuf 
# even if tf2onnx says it wants an old one.
override-dependencies = ["protobuf>=5.28.0"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pyright]
exclude = ["**/build", "**/.venv"]
pythonVersion = "3.11"
reportMissingImports = true
reportMissingTypeStubs = false
extraPaths = ["./src"]

